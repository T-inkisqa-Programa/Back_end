server:
  port: 8081

spring:
  application:
    name: iam-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tinkisqa_iam}
    username: ${DB_USER:tinkisqa}
    password: ${DB_PASSWORD:tinkisqa}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: T'inkisqa IAM Service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tinkisqa:
  security:
    jwt:
      secret: ${JWT_SECRET:change_me_dev_secret_with_at_least_32_chars}
      issuer: ${JWT_ISSUER:tinkisqa-iam}
  iam:
    access-token-ttl: PT${JWT_ACCESS_TTL_MINUTES:60}M
    refresh-token-ttl: P${JWT_REFRESH_TTL_DAYS:7}D
    otp:
      ttl: PT10M
      max-attempts: 5
      resend-cooldown: PT60S
    seed:
      enabled: ${IAM_SEED_ENABLED:false}
