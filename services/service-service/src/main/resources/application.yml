server:
  port: 8084

spring:
  application:
    name: service-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tinkisqa_service}
    username: ${DB_USER:tinkisqa}
    password: ${DB_PASSWORD:tinkisqa}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: T'inkisqa Service Service

springdoc:
  swagger-ui:
    path: /swagger-ui.html

tinkisqa:
  security:
    jwt:
      secret: ${JWT_SECRET:change_me_dev_secret_with_at_least_32_chars}
      issuer: ${JWT_ISSUER:tinkisqa-iam}
