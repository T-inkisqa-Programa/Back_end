name: tinkisqa

# =============================================================================
# T'inkisqa — Orquestación de microservicios
#
#   docker compose up -d --build
#
# Solo el API Gateway publica un puerto al host (8080). Los microservicios y
# PostgreSQL viven en la red interna `tinkisqa-net` y se comunican entre sí por
# NOMBRE DE CONTENEDOR (p. ej. http://iam-service:8081), nunca por localhost.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Base de datos (una instancia, una base de datos por servicio)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tinkisqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tinkisqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-tinkisqa}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tinkisqa} -d ${POSTGRES_DB:-tinkisqa}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Puerto NO publicado: solo accesible dentro de la red interna.
    # Descomenta para depurar localmente:
    # ports:
    #   - "5432:5432"

  # ---------------------------------------------------------------------------
  # IAM Service (autenticación, identidad, permisos, perfil)
  # ---------------------------------------------------------------------------
  iam-service:
    build:
      context: ./services/iam-service
    image: tinkisqa/iam-service:latest
    container_name: tinkisqa-iam-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tinkisqa_iam
      DB_USER: ${POSTGRES_USER:-tinkisqa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-60}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      # Datos de prueba (ADMIN + Usuaria A + Usuaria B). Solo desarrollo.
      IAM_SEED_ENABLED: ${IAM_SEED_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Social Service (comunidades, foros, publicaciones, comentarios, testimonios)
  # ---------------------------------------------------------------------------
  social-service:
    build:
      context: ./services/social-service
    image: tinkisqa/social-service:latest
    container_name: tinkisqa-social-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tinkisqa_social
      DB_USER: ${POSTGRES_USER:-tinkisqa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      SOCIAL_SEED_ENABLED: ${SOCIAL_SEED_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Content Service (artículos, recursos, biblioteca de bienestar)
  # ---------------------------------------------------------------------------
  content-service:
    build:
      context: ./services/content-service
    image: tinkisqa/content-service:latest
    container_name: tinkisqa-content-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tinkisqa_content
      DB_USER: ${POSTGRES_USER:-tinkisqa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Service Service (red de apoyo, psicólogas, voluntariado, postulaciones)
  # ---------------------------------------------------------------------------
  service-service:
    build:
      context: ./services/service-service
    image: tinkisqa/service-service:latest
    container_name: tinkisqa-service-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tinkisqa_service
      DB_USER: ${POSTGRES_USER:-tinkisqa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Engagement Service (rachas, notificaciones, métricas, actividad)
  # ---------------------------------------------------------------------------
  engagement-service:
    build:
      context: ./services/engagement-service
    image: tinkisqa/engagement-service:latest
    container_name: tinkisqa-engagement-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: tinkisqa_engagement
      DB_USER: ${POSTGRES_USER:-tinkisqa}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  # ---------------------------------------------------------------------------
  # API Gateway (único punto de entrada del frontend React/Expo)
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./gateway
    image: tinkisqa/gateway:latest
    container_name: tinkisqa-gateway
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-change_me_dev_secret_with_at_least_32_chars}
      JWT_ISSUER: ${JWT_ISSUER:-tinkisqa-iam}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      IAM_URL: ${IAM_URL:-http://iam-service:8081}
      SOCIAL_URL: ${SOCIAL_URL:-http://social-service:8082}
      CONTENT_URL: ${CONTENT_URL:-http://content-service:8083}
      SERVICE_URL: ${SERVICE_URL:-http://service-service:8084}
      ENGAGEMENT_URL: ${ENGAGEMENT_URL:-http://engagement-service:8085}
    depends_on:
      iam-service:
        condition: service_healthy
      social-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      service-service:
        condition: service_healthy
      engagement-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks:
      - tinkisqa-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s

networks:
  tinkisqa-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
